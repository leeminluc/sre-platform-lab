---
# =============================================================================
# Frontend Application - Kustomization (Base)
# =============================================================================
# This is the base configuration shared across all environments.
# Environment-specific overrides live in overlays/ (dev, staging, prod).
#
# Resource ordering in Kustomize:
#   1. namespace — must exist before anything else
#   2. networkpolicy — deny-all before allow rules
#   3. deployment — application pods
#   4. service — pod discovery
#   5. ingress — external access
#   6. hpa — autoscaling
#   7. pdb — disruption protection
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
