---
# =============================================================================
# Infrastructure - Top-Level Kustomization
# =============================================================================
# This kustomization aggregates all infrastructure components.
# FluxCD applies this via the infrastructure Kustomization resource.
#
# Reconciliation order matters:
#   1. NGINX ingress controller — must be running before apps create Ingress resources
#   2. cert-manager — must be ready before TLS-terminated ingress (Milestone 2)
#   3. External Secrets / Vault — must be ready before apps need secrets (Milestone 5)
#
# Each component lives in its own directory with its own kustomization,
# making it easy to enable/disable components per environment.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nginx-ingress/
  - cert-manager/
