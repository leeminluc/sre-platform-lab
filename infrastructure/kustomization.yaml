---
# =============================================================================
# Infrastructure - Top-Level Aggregation
# =============================================================================
# This Kustomization points to the controllers/ subdirectory only.
# Configs are handled by a SEPARATE Flux Kustomization (infrastructure-configs)
# because they depend on CRDs that controllers install.
#
# Flux dependency chain:
#   flux-system → infrastructure (this, controllers) → infrastructure-configs → apps
#
# Why not reference configs/ here too?
#   If we did, Kustomize would try to build configs/ and controllers/ together.
#   Flux validates all resources at once — the Certificate CRD wouldn't exist yet.
#   By making them separate Flux Kustomizations, Flux applies controllers first,
#   waits for health, then applies configs.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - controllers/
