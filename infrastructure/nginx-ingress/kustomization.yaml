# =============================================================================
# Infrastructure - NGINX Ingress Controller
# =============================================================================
# Production relevance: The NGINX ingress controller is the traffic entry
# point for all external HTTP/HTTPS requests. It replaces k3s's default
# Traefik controller (which we disabled during k3s installation).
#
# Why NGINX ingress over Traefik?
#   1. Larger community and ecosystem (more examples, more troubleshooting)
#   2. Consistent with cloud provider managed offerings (AWS ALB, GCP GLB)
#   3. Rich annotation support for rate limiting, auth, SSL, etc.
#   4. Wide adoption in enterprise environments
#
# In production, the ingress controller is deployed via its official Helm
# chart for version pinning and configuration management. This will be
# implemented in Milestone 2.
#
# Security considerations:
#   - Ingress controller should run in its own namespace (ingress-nginx)
#   - Resource limits are critical — this is a high-traffic component
#   - Enable rate limiting and connection limits per application
#   - Use cert-manager for automatic TLS certificate management
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NGINX ingress will be deployed via HelmRelease in Milestone 2.
# For now, this kustomization is empty to avoid errors.
resources: []
