---
# =============================================================================
# Infrastructure - NGINX Ingress Controller
# =============================================================================
# Production relevance: The NGINX ingress controller is the traffic entry
# point for all external HTTP/HTTPS requests. It replaces k3s's default
# Traefik controller (which we disabled during k3s installation).
#
# Why NGINX ingress over Traefik?
#   1. Larger community and ecosystem (more examples, more troubleshooting)
#   2. Rich annotation support for rate limiting, auth, SSL, etc.
#   3. Wide adoption in enterprise environments
#   4. Consistent with cloud provider managed offerings (AWS ALB, GCP GLB)
#
# Deployed via HelmRelease for:
#   - Version pinning and reproducibility
#   - GitOps-managed configuration (no manual helm commands)
#   - Automatic drift detection and remediation
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helm-repository.yaml
  - helm-release.yaml
