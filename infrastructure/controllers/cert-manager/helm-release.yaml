---
# =============================================================================
# Infrastructure - cert-manager HelmRelease
# =============================================================================
# Production relevance: cert-manager automates TLS certificate lifecycle.
# Key configuration:
#   - installCRDs: true — installs Custom Resource Definitions with the chart
#     (required before creating ClusterIssuer/Certificate resources)
#   - Resource limits — prevents cert-manager from consuming excessive resources
#   - replicaCount: 1 — sufficient for dev; use 2+ in production for HA
#
# In production, you would:
#   - Use an HTTP01 solver with a real domain (not self-signed)
#   - Configure DNS01 solver for wildcard certificates
#   - Set up certificate renewal notifications
#   - Use a dedicated service account with least-privilege RBAC
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m0s
  chart:
    spec:
      chart: cert-manager
      version: "v1.17.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  targetNamespace: cert-manager
  install:
    timeout: 5m0s
    remediation:
      retries: 3
  upgrade:
    timeout: 5m0s
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    timeout: 5m0s
    cleanupOnFail: true
  values:
    # MUST be true — installs CRDs so we can create ClusterIssuer below
    installCRDs: true

    replicaCount: 1

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Enable Prometheus metrics (for Milestone 3)
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false  # Will enable when Prometheus is deployed
