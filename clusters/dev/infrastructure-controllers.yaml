---
# =============================================================================
# Dev Cluster - Infrastructure Controllers Kustomization
# =============================================================================
# Production relevance: This Flux Kustomization tells Flux to watch the
# `infrastructure/` directory and apply those manifests to the cluster.
#
# Key design decisions:
#   1. Controllers are reconciled BEFORE configs and applications
#   2. Reuses the flux-system GitRepository source (already has auth from bootstrap)
#   3. 5-minute reconciliation interval (balance between drift detection and API load)
#   4. Health checks ensure infrastructure is ready before proceeding
#
# In production, you would also:
#   - Add image verification (cosign) for supply chain security
#   - Use path prefixes to separate CRDs from controllers
#   - Set stricter retry intervals with backoff
# =============================================================================
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  # Reconcile every 5 minutes — detects drift within 5 minutes
  interval: 5m0s
  # Reference the GitRepository created by flux bootstrap (has auth already)
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Path within the Git repository to find controller manifests
  path: ./infrastructure
  # Prune removes resources that are no longer in Git — prevents drift
  prune: true
  # Wait for infrastructure to be healthy before marking reconciliation done
  wait: true
  # Timeout for health checks — if infrastructure can't become healthy in 5m, fail
  timeout: 5m0s
