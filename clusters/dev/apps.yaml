---
# =============================================================================
# Dev Cluster - Applications Kustomization
# =============================================================================
# Production relevance: This Flux Kustomization deploys application workloads.
# The critical design decision here is the `dependsOn` field:
#
#   Applications MUST NOT be deployed before infrastructure is ready.
#   Without this dependency, you'd see race conditions like:
#   - Pods scheduling before ingress controller is running
#   - Applications failing because CRDs aren't installed yet
#   - Certificates failing because cert-manager isn't ready
#
# The dependsOn field creates a reconciliation DAG (directed acyclic graph):
#   flux-system → infrastructure-controllers → infrastructure-configs → apps
#
# This is the production pattern. Every mature GitOps setup uses dependency
# ordering. Without it, you're relying on luck and retry loops.
#
# Why depend on infrastructure-configs (not just infrastructure)?
#   - infrastructure installs controllers (creates CRDs)
#   - infrastructure-configs applies CRD-dependent configs (ClusterIssuer)
#   - Apps may need TLS certs from cert-manager → need ClusterIssuer ready
# =============================================================================
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Reconcile every 5 minutes
  interval: 5m0s
  # Reference the GitRepository created by flux bootstrap (has auth already)
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Path to application manifests
  path: ./apps
  # CRITICAL: Wait for infrastructure-configs before deploying apps
  # This ensures ClusterIssuer (and other CRD-dependent configs) are ready
  # before apps try to use TLS certificates or other infra-dependent features
  dependsOn:
    - name: infrastructure-configs
  # Prune removes resources that are no longer in Git
  prune: true
  wait: true
  timeout: 5m0s
